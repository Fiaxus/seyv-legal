<title>Seyv Yasal Metinler</title>
<style>
  :root { --bg:#F7FAF8; --card:#FFFFFF; --fg:#10312D; --muted:#5E7A74; --primary:#08A88A; --line:#E2E8E6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12181E; --card:#1B232B; --fg:#EEF6F4; --muted:#A3B8B2; --primary:#4FE3C1; --line:rgba(255,255,255,.09); }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { max-width:560px; margin:0 auto; padding:48px 16px 64px; }
  h1 { font-size:2rem; margin:0; color:var(--primary); }
  .sub { color:var(--muted); margin:4px 0 28px; }
  a.row { display:block; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:18px 20px; margin-bottom:12px; color:var(--fg); text-decoration:none; }
  a.row strong { display:block; font-size:1.05rem; }
  a.row span { color:var(--muted); font-size:.92rem; }
  footer { color:var(--muted); font-size:.85rem; text-align:center; margin-top:28px; }
  footer a { color:var(--primary); }
</style>
